server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: voyageiq-business-service
  datasource:
    url: jdbc:h2:file:./data/voyageiq;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
  mvc:
    async:
      request-timeout: 180s
  lifecycle:
    timeout-per-shutdown-phase: 20s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USERNAME:voyageiq}
    password: ${RABBITMQ_PASSWORD:voyageiq_dev}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 200ms
          multiplier: 2
          max-interval: 2s

management:
  health:
    rabbit:
      enabled: ${VOYAGEIQ_MESSAGING_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

voyageiq:
  security:
    jwt-secret: ${VOYAGEIQ_JWT_SECRET:local-development-secret-change-before-production-2026}
    token-ttl: 8h
    internal-service-key: ${VOYAGEIQ_INTERNAL_SERVICE_KEY:voyageiq-local-internal-key}
  agent:
    base-url: ${VOYAGEIQ_AGENT_URL:http://localhost:8001}
    connect-timeout: 2s
    response-timeout: 180s
  cors:
    allowed-origins: ${VOYAGEIQ_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  messaging:
    enabled: ${VOYAGEIQ_MESSAGING_ENABLED:false}
    publish-batch-size: 100
    processing-timeout: 30s

logging:
  level:
    com.voyageiq: INFO
