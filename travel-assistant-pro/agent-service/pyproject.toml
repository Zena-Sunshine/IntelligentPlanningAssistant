[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voyageiq-agent-service"
version = "2.0.0"
description = "FastAPI multi-agent runtime for VoyageIQ"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.8",
  "uvicorn[standard]==0.39.0",
  "httpx==0.28.1",
  "pydantic-settings==2.12.0",
  "python-dotenv==1.2.1",
  "sse-starlette==3.2.0",
  "structlog==25.5.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]

[tool.setuptools.packages.find]
include = ["app*", "evaluation*"]

